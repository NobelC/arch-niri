monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 2500
        priority.driver = 2500
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*hdmi*" }
      { node.name = "~alsa_output.*HDMI*" }
      { node.name = "~alsa_output.*displayport*" }
      { api.alsa.pcm.stream = "playback", device.profile.name = "~.*hdmi.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1800
        priority.driver = 1800
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.pci-.*analog.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1000
        priority.driver = 1000
      }
    }
  }
  {
    # Tarjeta interna forzada a perfil "pro-audio" (no tiene perfil analog-stereo
    # disponible). Bajo ese perfil los nodos no incluyen "analog" en el nombre,
    # así que la regla de arriba nunca los alcanza y quedan todos con la misma
    # prioridad -> WirePlumber podía elegir como default el nodo de 8ch (probable
    # salida HDMI/DP interna del chip) en vez del parlante real, dejando el audio
    # "mudo" sin aviso. pro-output-0 (2ch, el parlante físico) queda fijo como
    # salida preferida; pro-output-3 (8ch) baja de prioridad para que solo se use
    # si lo seleccionas a mano.
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.pro-output-0" }
    ]
    actions = {
      update-props = {
        priority.session = 1200
        priority.driver = 1200
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.pro-output-3" }
    ]
    actions = {
      update-props = {
        priority.session = 300
        priority.driver = 300
      }
    }
  }
]