[mgr]
cwd = { fg = "{{colors.primary.default.hex}}", bold = true }

hovered         = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
preview_hovered = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }

find_keyword  = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
find_position = { fg = "{{colors.secondary.default.hex}}", bg = "reset", bold = true }

marker_copied   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}", bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }
marker_selected = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.primary.default.hex}}" }

count_copied   = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
count_cut      = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
count_selected = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }

border_symbol = "┃"
border_style  = { fg = "{{colors.outline.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}", bold = true }

select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}", bold = true }

unset_main  = { fg = "{{colors.on_tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}", bold = true }

[status]
overall   = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}", bg = "{{colors.surface_container_highest.default.hex}}" }

perm_type  = { fg = "{{colors.primary.default.hex}}" }
perm_read  = { fg = "{{colors.tertiary.default.hex}}" }
perm_write = { fg = "{{colors.error.default.hex}}" }
perm_exec  = { fg = "{{colors.secondary.default.hex}}" }
perm_sep   = { fg = "{{colors.outline.default.hex}}" }

[tabs]
active    = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[input]
border   = { fg = "{{colors.primary.default.hex}}" }
title    = { fg = "{{colors.primary.default.hex}}", bold = true }
value    = { fg = "{{colors.on_surface.default.hex}}" }
selected = { reversed = true }

[pick]
border   = { fg = "{{colors.primary.default.hex}}" }
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface.default.hex}}" }

[confirm]
border  = { fg = "{{colors.error.default.hex}}" }
title   = { fg = "{{colors.error.default.hex}}", bold = true }
content = { fg = "{{colors.on_surface.default.hex}}" }
list    = { fg = "{{colors.on_surface_variant.default.hex}}" }
btn_yes = { fg = "{{colors.on_error.default.hex}}", bg = "{{colors.error.default.hex}}", bold = true }
btn_no  = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }

[completion]
border = { fg = "{{colors.primary.default.hex}}" }

[tasks]
border  = { fg = "{{colors.primary.default.hex}}" }
title   = { fg = "{{colors.primary.default.hex}}", bold = true }
hovered = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }

[which]
mask            = { bg = "{{colors.surface_container_lowest.default.hex}}" }
cand            = { fg = "{{colors.primary.default.hex}}", bold = true }
rest            = { fg = "{{colors.outline.default.hex}}" }
desc            = { fg = "{{colors.on_surface.default.hex}}" }
separator       = " // "
separator_style = { fg = "{{colors.outline.default.hex}}" }

[notify]
title_info  = { fg = "{{colors.primary.default.hex}}", bold = true }
title_warn  = { fg = "{{colors.tertiary.default.hex}}", bold = true }
title_error = { fg = "{{colors.error.default.hex}}", bold = true }

[help]
on      = { fg = "{{colors.tertiary.default.hex}}", bold = true }
run     = { fg = "{{colors.secondary.default.hex}}" }
desc    = { fg = "{{colors.on_surface_variant.default.hex}}" }
hovered = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
footer  = { fg = "{{colors.on_surface.default.hex}}", bg = "{{colors.surface_container.default.hex}}", bold = true }

[filetype]
rules = [
  { mime = "image/*", fg = "{{colors.tertiary.default.hex}}" },
  { mime = "{audio,video}/*", fg = "{{colors.secondary.default.hex}}" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*}", fg = "{{colors.error.default.hex}}" },
  { mime = "application/{pdf,doc,rtf}", fg = "{{colors.tertiary_fixed_dim.default.hex}}" },
  { url = "*", is = "orphan", fg = "{{colors.error.default.hex}}", bold = true },
  { url = "*", is = "exec", fg = "{{colors.tertiary.default.hex}}", bold = true },
  { url = "*/", fg = "{{colors.primary.default.hex}}", bold = true },
]
