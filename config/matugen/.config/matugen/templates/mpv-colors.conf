# Fondo de ventana (cuando se abre sin vídeo o en barras negras)
background-color='{{colors.surface.default.hex}}'

# Colores del OSD nativo (mensajes, playlistmanager, quality-menu)
osd-color='{{colors.on_surface.default.hex}}'
osd-border-color='{{colors.surface_container_lowest.default.hex}}'
osd-back-color='#CC{{colors.surface_container.default.hex_stripped}}'
osd-selected-color='{{colors.primary.default.hex}}'

# Colores para uosc (si tienes instalado el script uosc)
script-opts-append=uosc-color=foreground={{colors.on_surface.default.hex_stripped}},foreground_text={{colors.surface.default.hex_stripped}},background={{colors.surface.default.hex_stripped}},background_text={{colors.on_surface.default.hex_stripped}},curtain={{colors.surface_container_lowest.default.hex_stripped}},success={{colors.tertiary.default.hex_stripped}},error={{colors.error.default.hex_stripped}}
