# Fondo de ventana
background-color='{{colors.surface.default.hex}}'

# OSD nativo (reloj, mensajes, stats, fallback de quality-menu)
osd-font='JetBrainsMono Nerd Font'
osd-bold=yes
osd-border-size=2.0
osd-shadow-offset=0
osd-color='{{colors.on_surface.default.hex}}'
osd-border-color='{{colors.surface_container_lowest.default.hex}}'
osd-back-color='#E6{{colors.surface_container.default.hex_stripped}}'
osd-selected-color='{{colors.primary.default.hex}}'

# uosc (controles on-screen, barra de progreso y menús integrados)
script-opts-append=uosc-color=foreground={{colors.primary.default.hex_stripped}},foreground_text={{colors.on_primary.default.hex_stripped}},background={{colors.surface.default.hex_stripped}},background_text={{colors.on_surface.default.hex_stripped}},curtain={{colors.surface_container_lowest.default.hex_stripped}},success={{colors.tertiary.default.hex_stripped}},error={{colors.error.default.hex_stripped}}
script-opts-append=uosc-timeline_style=bar
script-opts-append=uosc-timeline_border=2
script-opts-append=uosc-font_bold=yes
script-opts-append=uosc-progress=windowed

# quality-menu (tipografía y telón a juego si uosc no está activo)
script-opts-append=quality_menu-style_ass_tags={\fnJetBrainsMono Nerd Font\fs22\b1\bord2}
script-opts-append=quality_menu-curtain_opacity=0.82
