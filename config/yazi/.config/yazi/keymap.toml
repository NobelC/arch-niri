# 1. Enter: Si es carpeta, entra en ella y cierra Yazi dejándote en esa ruta en Ghostty.
#           Si es archivo, lo abre con su opener (nvim, mpv, zathura, etc.).
[[mgr.prepend_keymap]]
on   = [ "<Enter>" ]
run  = "plugin smart-enter"
desc = "Entrar a carpeta en Ghostty o abrir archivo"

# 2. Shift+Enter (o 'E' mayúscula): Abre la carpeta seleccionada (o la actual si estás sobre un archivo)
#    directamente como root en Neovim.
[[mgr.prepend_keymap]]
on   = [ "<S-Enter>" ]
run  = 'shell --block -- nvim "${0:-.}"'
desc = "Abrir carpeta en Neovim"

[[mgr.prepend_keymap]]
on   = [ "E" ]
run  = 'shell --block -- nvim "${0:-.}"'
desc = "Abrir carpeta en Neovim (alternativo)"

# 3. Discos externos y USB (/run/media/NobelC)
[[mgr.prepend_keymap]]
on   = [ "g", "m" ]
run  = 'cd /run/media/NobelC'
desc = "Ir a discos externos y USB montados"

[[mgr.prepend_keymap]]
on   = [ "M" ]
run  = '''shell --block -- bash -c 'udiskie-mount -a; sleep 0.5' '''
desc = "Montar todos los discos/USB conectados"

[[mgr.prepend_keymap]]
on   = [ "U" ]
run  = '''shell --block -- bash -c 't="${1:-.}"; mp="$(findmnt -n -o TARGET --target "$t" 2>/dev/null || echo "$t")"; udiskie-umount --detach "$mp" || udiskie-umount "$mp" || { echo; read -rp "Error al desmontar (Enter para volver)..."; }' -- "$1"'''
desc = "Desmontar y expulsar disco seleccionado de forma segura"
