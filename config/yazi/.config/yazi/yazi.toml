[mgr]
ratio          = [ 1, 3, 4 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
title_format   = "記録 // YAZI: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1200
max_height      = 1200
image_delay     = 30
image_filter    = "triangle"
image_quality   = 80

[opener]
edit = [
    { run = 'nvim "$@"', block = true, desc = "Neovim" },
]
play = [
    { run = 'setsid -f mpv --force-window=immediate "$@" >/dev/null 2>&1', orphan = true, desc = "mpv (independiente)" },
]
pdf = [
    { run = 'zathura "$@"', orphan = true, desc = "Zathura" },
]
open = [
    { run = 'xdg-open "$1"', orphan = true, desc = "Abrir (xdg-open)" },
]

[open]
rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/x-ndjson", use = "edit" },
    { mime = "inode/x-empty", use = "edit" },
    { mime = "video/*", use = "play" },
    { mime = "audio/*", use = "play" },
    { mime = "application/pdf", use = "pdf" },
    { url = "*", use = "open" },
]
