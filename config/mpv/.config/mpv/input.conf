# ~/.config/mpv/input.conf

q quit
Q quit-watch-later

f cycle fullscreen

# Capturas
s screenshot
S screenshot video
Ctrl+s screenshot subtitles

# Seeking
LEFT seek -5 exact
RIGHT seek 5 exact
Shift+LEFT seek -30 exact
Shift+RIGHT seek 30 exact
UP seek 60 exact
DOWN seek -60 exact
PGUP seek 600 exact
PGDWN seek -600 exact

# Frame a frame
Ctrl+LEFT frame-back-step
Ctrl+RIGHT frame-step

# Playlist
> playlist-next
< playlist-prev
Ctrl+p script-message-to playlistmanager playlistmanager show playlist

# Velocidad
[ add speed -0.1
] add speed 0.1
BS set speed 1.0

# Bucle A-B
l ab-loop

# Volumen/audio
9 add volume -5
0 add volume 5
WHEEL_UP add volume 2
WHEEL_DOWN add volume -2
m cycle mute
+ add audio-delay 0.1
- add audio-delay -0.1

# Pistas
j cycle sub
J cycle sub down
k cycle audio
K cycle audio down
v cycle sub-visibility
u cycle-values sub-scale 0.8 1.0 1.2 1.5

# Aspecto
a cycle-values video-aspect-override 16:9 4:3 2.35:1 -1

# Calidad / hardware / efectos
h cycle-values hwdec auto-safe no
d cycle deband
z cycle interpolation
t cycle temporal-dither

# Rotación
Ctrl+r cycle-values video-rotate 90 180 270 0

# Stats
i script-binding stats/display-stats
I script-binding stats/display-page-2

# Perfiles
F1 apply-profile fast
F2 apply-profile anime
F3 apply-profile hdr-to-sdr
F4 apply-profile high-quality

# --- uosc (interfaz) ---
MBTN_RIGHT  script-binding uosc/menu
menu        script-binding uosc/menu
Tab         script-binding uosc/toggle-ui
Ctrl+o      script-binding uosc/open-file
p           script-binding uosc/items
c           script-binding uosc/chapters
`           script-binding uosc/keybinds

# --- Calidad de streams (quality-menu) ---
Ctrl+f script-binding quality_menu/video_formats_toggle
Alt+f  script-binding quality_menu/audio_formats_toggle
